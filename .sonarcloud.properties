# ── SonarQube Cloud automatic analysis configuration ─────────────────
# Automatic analysis reads THIS file (not sonar-project.properties,
# which is only used by CI-based analysis). Wildcard patterns are not
# allowed here.
#
# lib/projects.ts is pure, intentionally structured data: its four
# records share an identical field layout. TypeScript duplication
# detection normalizes string literals, so any repeating-record
# structure is flagged as copy-paste no matter the content. Exclude the
# data file from CPD; every other metric still counts it.
sonar.cpd.exclusions=lib/projects.ts
