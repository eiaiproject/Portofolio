# ── SonarCloud project configuration ──────────────────────────────────
# Organization and project key are shown in your SonarCloud dashboard
# when you create the project (https://sonarcloud.io/projects/create).
# Defaults assume the SonarCloud org `eiaiproject` and the standard
# `{org}_{repo}` key. Adjust if yours differ.
sonar.organization=eiaiproject
sonar.projectKey=eiaiproject_Portofolio
sonar.projectName=Anggie Irawan Portfolio

# ── Analysis scope ──
sonar.sources=app,components,lib
sonar.exclusions=**/node_modules/**,**/.next/**,**/out/**,**/public/**,**/*.config.*,next-env.d.ts,**/temp_ledjer/**

# ── Duplication detection ──
# lib/projects.ts is pure, intentionally structured data: its four records
# share an identical field layout. TypeScript duplication detection
# normalizes string literals, so any repeating-record structure is flagged
# as copy-paste no matter the content (the tuple refactor confirmed this:
# duplication only dropped 68→56 lines). Exclude the data file from CPD;
# every other metric still counts it.
sonar.cpd.exclusions=lib/projects.ts

# ── Encoding ──
sonar.sourceEncoding=UTF-8
