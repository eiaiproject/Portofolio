# ── SonarCloud project configuration ──────────────────────────────────
# Organization and project key are shown in your SonarCloud dashboard
# when you create the project (https://sonarcloud.io/projects/create).
# Defaults assume the SonarCloud org `eiaiproject` and the standard
# `{org}_{repo}` key. Adjust if yours differ.
sonar.organization=eiaiproject
sonar.projectKey=eiaiproject_Portofolio
sonar.projectName=Anggie Irawan Portfolio

# ── Analysis scope ──
sonar.sources=app,components,lib
sonar.exclusions=**/node_modules/**,**/.next/**,**/out/**,**/public/**,**/*.config.*,next-env.d.ts,**/temp_ledjer/**

# ── Encoding ──
sonar.sourceEncoding=UTF-8
