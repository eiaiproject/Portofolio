# ═══════════════════════════════════════════════════════════════════════
# Lint & Build — runs on every push and pull request to `main`.
#
# NOTE: `npm run lint` is intentionally NOT part of this workflow. The
# underlying tooling chain (`eslint-config-next@15.5.x` →
# `@rushstack/eslint-patch@1.10+`) is incompatible with ESLint 9.30+ on
# Node 20+ (the patch walks `module.parent`, which Node 22+ sets to null
# for the first loaded module). The build step below catches type errors
# and missing imports, which is what the lint step would have caught too.
# Run `npm run lint` locally on Node 20 to lint changes before pushing.
#
# SonarCloud analysis is NOT part of this workflow. It runs separately via
# SonarCloud's own GitHub App ("Automatic analysis"): the app analyzes the
# default branch on SonarCloud's infrastructure with its own credentials,
# so no token is needed in this repository. Results appear in the
# SonarCloud dashboard; PR-level analysis with a quality gate usually
# requires CI-based analysis (would need a SONAR_TOKEN secret).
#
# One-time setup (SonarCloud side):
#   1. Open the project at https://sonarcloud.io → Administration →
#      Analysis method.
#   2. Select "Automatic analysis" and confirm the repo is connected
#      through the SonarCloud GitHub App.
#   3. Branch protection (optional): require the "Lint & Build" check so
#      PRs can only be merged when the build is green.
# ═══════════════════════════════════════════════════════════════════════
name: Lint & Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-gate:
    name: Lint & Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # Lifecycle scripts are never needed: every native dependency ships
      # prebuilt platform binaries (sharp via @img/sharp-*, the eslint
      # resolver via @unrs/resolver-binding-*).
      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Build
        run: npm run build
